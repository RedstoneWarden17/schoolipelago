<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archipelago Web Game Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- SERVER CONNECT BAR -->
        <header id="connection-panel">
            <div class="input-row">
                <input type="text" id="server-url" value="archipelago.gg:38281" placeholder="server:port">
                <input type="text" id="slot-name" placeholder="Slot Name">
                <input type="password" id="password" placeholder="Password (Optional)">
                <button id="connect-btn">Connect to Multiworld</button>
            </div>
            <div id="status-text" class="disconnected">Status: Disconnected</div>
        </header>

        <!-- MAIN GAME VIEWPORT -->
        <div id="main-layout">
            <!-- GAME SCREEN / ACTIONS -->
            <section id="gameplay-area">
                <h2>Game World Interaction</h2>
                <p>Interact with the world objects below to check locations and send items to other players.</p>
                
                <div class="action-grid">
                    <button class="location-btn" data-location-id="1001" disabled>Chest 1: Open Chest</button>
                    <button class="location-btn" data-location-id="1002" disabled>Chest 2: Defeat Mini-Boss</button>
                    <button class="location-btn" data-location-id="1003" disabled>Chest 3: Inspect Fountain</button>
                </div>

                <div id="game-log">
                    <div class="log-entry system">Welcome. Enter server details above to begin.</div>
                </div>
            </section>

            <!-- INVENTORY SIDEBAR -->
            <aside id="inventory-panel">
                <h3>Received Items</h3>
                <div id="inventory-grid">
                    <div class="item-card" id="item-2001" data-count="0">
                        <span class="item-name">Sword Progression</span>
                        <span class="item-qty">x0</span>
                    </div>
                    <div class="item-card" id="item-2002" data-count="0">
                        <span class="item-name">Bombs</span>
                        <span class="item-qty">x0</span>
                    </div>
                    <div class="item-card" id="item-2003" data-count="0">
                        <span class="item-name">Hookshot</span>
                        <span class="item-qty">x0</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
